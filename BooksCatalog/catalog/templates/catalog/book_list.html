<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kitoblar ro'yxati</title>
</head>
<body>
    <h1>Barcha kitoblar</h1>

    {% if books %}
        <ul>
            {% for book in books %}
                <li>
                    <a href="{% url 'book_detail' book_id=book.pk %}">
                        <strong>{{ book.title }}</strong>
                    </a> 
                    — {{ book.author }} 
                    (Janr: {{ book.category.name|default:"Ko'rsatilmagan" }})
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Hozircha kitoblar yo'q.</p>
    {% endif %}
</body>
</html>
